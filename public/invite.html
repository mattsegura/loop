<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FDFCFB">
<script src="/theme-boot.js"></script>
<meta name="robots" content="noindex">
<title>You’re invited · Loop</title>
<meta property="og:title" content="You’re invited to Loop">
<meta property="og:description" content="Get your personal Loop agent over iMessage and across every AI tool you use.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://useloop.sh/og-preview.png?v=2">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="You’re invited to Loop">
<meta name="twitter:description" content="Keep every agent in the loop. Your apps, memory, and personal AI — even in Messages.">
<meta name="twitter:image" content="https://useloop.sh/og-preview.png?v=2">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{
  --bg:light-dark(#FDFCFB, #1A1614);
  --card:light-dark(#FFFFFF, #241F1E);
  --tint:light-dark(#F5EFED, #252120);
  --line:light-dark(#EBE2DF, #332E2C);
  --ink:light-dark(#3F2C2A, #F1E5E4);
  --muted:light-dark(#6F5A57, #C3AEAA);
  --faint:light-dark(#9A8783, #94827F);
  --brand:light-dark(#4D3533, #E6D8D6);
  --brand-hover:light-dark(#3B2725, #F7EBE9);
  --ok:light-dark(#3F7556, #87B89A);
  --okbg:light-dark(#E9F2EC, #202522);
  --no:light-dark(#A3412F, #F0907D);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
body{
  font:15.5px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  min-height:100vh;
  min-height:100svh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:clamp(48px,11vh,108px) 22px 44px;
}
a{color:inherit}
button{font:inherit}
.shell{
  width:min(460px,100%);
  flex:1 0 auto;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.stage{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  animation:fadeUp .32s cubic-bezier(.22,1,.36,1);
}
.stage.left{align-items:stretch;text-align:left}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:none}
}
@media (prefers-reduced-motion:reduce){
  .stage{animation:none}
  .pulse{animation:none}
  .spin{animation:none}
}
.logo-link{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.logo{height:38px;width:auto;display:block}
.logo.sm{height:28px}
.h{
  font:500 clamp(27px,6vw,34px)/1.18 var(--serif);
  letter-spacing:-.015em;
  color:var(--ink);
  margin:30px 0 0;
  text-wrap:balance;
}
.h.tight{margin-top:20px}
.lead{
  font-size:15.5px;
  line-height:1.58;
  color:var(--muted);
  margin:14px 0 0;
  max-width:390px;
  text-wrap:pretty;
}
.stage.left .lead{max-width:none}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  width:100%;
  height:52px;
  padding:0 22px;
  border-radius:999px;
  font:500 15.5px/1 var(--sans);
  letter-spacing:-.005em;
  border:0;
  cursor:pointer;
  text-decoration:none;
  transition:background .16s ease,transform .12s ease,box-shadow .16s ease,opacity .16s ease;
}
.btn:active:not(:disabled){transform:scale(.99)}
.btn:disabled{opacity:.6;cursor:default}
.btn.pri{
  background:var(--brand);
  color:var(--bg);
  box-shadow:0 6px 20px light-dark(rgba(77,53,51,.14), rgba(0, 0, 0, 0.43));
}
.btn.pri:hover:not(:disabled){background:var(--brand-hover)}
.btn.out{
  background:var(--card);
  color:var(--ink);
  border:1px solid var(--line);
}
.btn.out:hover:not(:disabled){border-color:light-dark(rgba(77,53,51,.28), rgba(230, 216, 214, 0.28))}
.cta-gap{margin-top:34px}
.cta-gap-sm{margin-top:24px}
.subtle-link{
  display:inline-block;
  margin-top:22px;
  font-size:14px;
  color:var(--muted);
  text-decoration:none;
  border-bottom:1px solid var(--line);
  padding-bottom:2px;
  transition:color .15s ease,border-color .15s ease;
}
.subtle-link:hover{color:var(--ink);border-color:var(--ink)}

/* Step 2: 3 crisp trust & beta rows */
.points{
  list-style:none;
  margin:34px 0 0;
  padding:0;
  width:100%;
  display:flex;
  flex-direction:column;
  gap:24px;
  text-align:left;
}
.point{
  display:flex;
  align-items:flex-start;
  gap:16px;
}
.point-ic{
  width:42px;
  height:42px;
  border-radius:12px;
  background:var(--tint);
  color:var(--brand);
  display:grid;
  place-items:center;
  flex:none;
  margin-top:2px;
}
.point-ic svg{width:20px;height:20px;display:block}
.point-body{flex:1;min-width:0}
.point-title{
  margin:0;
  font:600 15.5px/1.35 var(--sans);
  color:var(--ink);
}
.point-desc{
  margin:4px 0 0;
  font:400 14.5px/1.55 var(--sans);
  color:var(--muted);
}

/* Step 3: Sign in + Connect Messages */
.signin-wrap{
  width:100%;
  margin-top:24px;
  display:flex;
  justify-content:center;
  min-height:120px;
}
.wait{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-top:18px;
  font-size:13.5px;
  color:var(--muted);
}
.pulse{
  width:8px;
  height:8px;
  border-radius:999px;
  background:light-dark(#C9A77A, #7F633D);
  box-shadow:0 0 0 4px light-dark(rgba(201,167,122,.24), rgba(127, 99, 61, 0.24));
  animation:pulseDot 1.6s ease-in-out infinite;
  flex:none;
}
@keyframes pulseDot{50%{opacity:.38}}
.fallback{
  width:100%;
  margin-top:26px;
  padding:16px;
  border-radius:16px;
  background:var(--card);
  border:1px solid var(--line);
  text-align:left;
}
.fallback-lbl{
  margin:0 0 12px;
  font-size:12.5px;
  color:var(--muted);
}
.copy-rows{display:flex;flex-direction:column;gap:8px}
.copy-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 8px 8px 12px;
  border-radius:11px;
  background:var(--bg);
  border:1px solid var(--line);
}
.copy-k{
  font-size:11px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.05em;
  color:var(--faint);
  min-width:34px;
}
.copy-v{
  flex:1;
  min-width:0;
  font:600 13.5px/1.3 var(--mono);
  color:var(--ink);
  overflow-x:auto;
  white-space:nowrap;
  user-select:all;
}
.copy-btn{
  flex:none;
  height:30px;
  padding:0 12px;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--ink);
  font:500 12.5px/1 var(--sans);
  cursor:pointer;
  transition:border-color .15s ease,background .15s ease;
}
.copy-btn:hover{border-color:light-dark(rgba(77,53,51,.3), rgba(230, 216, 214, 0.3));background:var(--tint)}

.check-lg{
  width:56px;
  height:56px;
  border-radius:999px;
  background:var(--okbg);
  color:var(--ok);
  display:grid;
  place-items:center;
  margin-top:24px;
}
.check-lg svg{width:26px;height:26px;display:block}

.loading{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
  margin-top:34px;
  color:var(--muted);
  font-size:14px;
}
.spin{
  width:22px;
  height:22px;
  border-radius:999px;
  border:2px solid var(--line);
  border-top-color:var(--brand);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.err-msg{
  margin:14px 0 0;
  font-size:13.5px;
  color:var(--no);
}

.foot{
  margin-top:48px;
  padding-top:16px;
  font-size:12.5px;
  color:var(--faint);
  display:flex;
  align-items:center;
  gap:16px;
}
.foot a{text-decoration:none}
.foot a:hover{color:var(--muted)}
:root[data-dark] img[src$="logo.svg"] { filter: brightness(0) invert(.9) sepia(.12); }
</style>
</head>
<body>
<main class="shell" id="app" aria-live="polite">
  <div class="stage">
    <a class="logo-link" href="/" aria-label="Loop"><img class="logo" src="/logo.svg" alt="Loop" width="87" height="38"></a>
    <div class="loading"><span class="spin" aria-hidden="true"></span><span>Loading your invite…</span></div>
  </div>
</main>
<footer class="foot">
  <a href="/privacy.html">Privacy</a>
  <a href="/terms.html">Terms</a>
</footer>
<script type="module" src="/invite.js"></script>
</body>
</html>
